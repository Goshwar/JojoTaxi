<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/Images/Logo.png">
    <link rel="apple-touch-icon" href="/Images/Logo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Fallback metadata for crawlers that do not execute JavaScript. Every tag
      below that Seo.tsx also emits carries data-rh="true" so react-helmet-async
      takes ownership of it on mount and REPLACES it, rather than appending a
      second copy. Without that attribute each page ends up with duplicate
      description/og tags and crawlers read the generic homepage values.
    -->
    <meta data-rh="true" name="description" content="FUNtastic Taxi & Tours — St. Lucia private airport transfers, island tours & taxi service. Licensed local experts. Book online instantly." />
    <title>FUNtastic Taxi &amp; Tours | Airport Transfers &amp; Island Tours</title>
    <link data-rh="true" rel="canonical" href="https://funtastictaxitours.com/" />

    <!-- Open Graph -->
    <meta data-rh="true" property="og:type" content="website" />
    <meta data-rh="true" property="og:site_name" content="FUNtastic Taxi & Tours" />
    <meta data-rh="true" property="og:title" content="FUNtastic Taxi & Tours | St. Lucia Airport Transfers & Island Tours" />
    <meta data-rh="true" property="og:description" content="Private airport transfers, island tours and taxi service in St. Lucia. Book online instantly with FUNtastic — St. Lucia's local taxi experts." />
    <meta data-rh="true" property="og:url" content="https://funtastictaxitours.com/" />
    <meta data-rh="true" property="og:image" content="https://funtastictaxitours.com/Images/pitons-1.jpg" />
    <meta data-rh="true" property="og:locale" content="en_US" />
    <!-- Not emitted per-page, so left unmanaged -->
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card -->
    <meta data-rh="true" name="twitter:card" content="summary_large_image" />
    <meta data-rh="true" name="twitter:title" content="FUNtastic Taxi & Tours | St. Lucia" />
    <meta data-rh="true" name="twitter:description" content="Private airport transfers, island tours and taxi service in St. Lucia. Book online instantly." />
    <meta data-rh="true" name="twitter:image" content="https://funtastictaxitours.com/Images/pitons-1.jpg" />

    <!--
      Structured data now lives in src/lib/schema.ts and is emitted per page via
      <JsonLd>, so it is captured by the build-time prerenderer. Keeping a copy
      here as well would give every page two competing business entities.
    -->

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet" />

    <!-- Print Styles -->
    <style media="print">
      nav, footer { display: none !important; }
      .booking-summary { width: 100% !important; }
      @page { margin: 2cm; }
    </style>

    <!-- Reduced Motion -->
    <style>
      @media (prefers-reduced-motion: reduce) {
        * {
          animation-duration: 0.001ms !important;
          transition: none !important;
          scroll-behavior: auto !important;
        }
      }
    </style>

    <!-- Unregister stale service workers -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var reg of registrations) { reg.unregister(); }
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
